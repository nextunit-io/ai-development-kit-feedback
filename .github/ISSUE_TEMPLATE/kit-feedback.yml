name: Kit feedback
description: A problem with nextunit-kit itself. Do not paste code, paths or project names.
title: "[<category>] <component>: <topic>"
labels: ["kit-feedback"]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: "agent:<name>, gate:<id>, script:<name>:<command>, skill:<name> or region:<id>"
      placeholder: agent:dev-implementer
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - instruction-misled
        - noisy-gate
        - missing-check
        - script-error
        - escalation
        - upstream-candidate
        - docs
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: Topic
      description: Kebab-case, at most 40 characters. The same problem gets the same topic.
      placeholder: locked-test-scope
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: What happened
      description: The kit's behavior, at most 300 characters.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
  - type: input
    id: version
    attributes:
      label: Kit version and packs
      placeholder: 0.1.0, go
